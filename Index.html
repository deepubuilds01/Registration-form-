
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- CSS -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 25px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #33333355;
        }

        h1 {
            text-align: center;
            color: #5a4fcf;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5145cd;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            overflow-wrap: anywhere;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Registration</h1>
        <p>Fill in your details</p>

        <form id="studentForm">
            <label>Full Name</label>
            <input type="text" id="name" required
                   placeholder="Enter full name">

            <label>Email</label>
            <input type="email" id="email" required
                   placeholder="Enter email">

            <label>Phone Number</label>
            <input type="tel" id="phone"
                   pattern="[0-9]{10}" maxlength="10"
                   inputmode="numeric" required
                   placeholder="10-digit phone number">

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Course</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>

            <label>Address</label>
            <textarea id="address" rows="3"
                      required placeholder="Enter address"></textarea>

            <button type="submit" id="submitBtn">
                Register Now
            </button>

            <p id="message" role="status"></p>
        </form>
    </div>

    <!-- JavaScript + Firebase -->
    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        // Replace these values with your Firebase configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase setup
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("studentForm");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        // Form validation and submission
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                dob: document.getElementById("dob").value,
                gender: document.getElementById("gender").value,
                course: document.getElementById("course").value,
                address: document.getElementById("address").value.trim()
            };

            if (Object.values(student).some(value => !value)) {
                message.textContent = "Please fill all fields!";
                return;
            }

            if (!/^[0-9]{10}$/.test(student.phone)) {
                message.textContent = "Enter a valid 10-digit phone number!";
                return;
            }

            if (new Date(student.dob) > new Date()) {
                message.textContent = "Date of birth cannot be in the future!";
                return;
            }

            submitBtn.disabled = true;
            message.textContent = "Submitting...";

            try {
                await addDoc(collection(db, "students"), {
                    ...student,
                    createdAt: serverTimestamp()
                });

                message.textContent = "Registration successful!";
                form.reset();

            } catch (error) {
                console.error(error);
                message.textContent =
                    "Failed to register. Check Firebase configuration and database rules.";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
